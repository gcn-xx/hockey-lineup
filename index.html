<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lineup">
<meta name="theme-color" content="#0a0a0a">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Hockey Lineup</title>
<style>
:root{--bg:#0a0a0a;--panel:#141414;--panel2:#1c1c1c;--line:#232323;--txt:#ededed;--mut:#8a8a8a;--acc:#4f8ff7;--danger:#e5484d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:17px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font-family:inherit}
#hdr{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:rgba(10,10,10,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
#teamBtn{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:9px 13px;font-size:17px;font-weight:600;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 12px;font-size:14px}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.sm{padding:5px 9px;font-size:13px;border-radius:7px}
main{padding:12px 12px 10px;max-width:560px;margin:0 auto}
.h2{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:14px 2px 8px;font-weight:600}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.sechd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sechd b{font-size:15px}
.slotrow{display:flex;gap:8px;margin-bottom:8px}
.slotrow:last-child{margin-bottom:0}
.slot{flex:1;min-height:66px;border:1px dashed #343434;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 4px;position:relative;user-select:none;-webkit-user-select:none;transition:background .1s}
.slot.full{border-style:solid;border-color:var(--line);background:var(--panel2)}
.slot.hover{border-color:var(--acc);background:#152238}
.lab{font-size:10px;color:var(--mut);letter-spacing:.08em;text-transform:uppercase}
.slot .lab{font-size:12px;font-weight:700;color:#9a9a9a;letter-spacing:.06em}
.slot.full .lab{opacity:.75}
.ph{font-size:14px;font-weight:600;color:#6f6f6f;letter-spacing:.02em}
.chip{display:flex;align-items:center;gap:5px;font-weight:600;font-size:16px;touch-action:none;cursor:grab;position:relative;padding-right:14px;user-select:none;-webkit-user-select:none}
.chip.sel{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px}
.chip .num{color:var(--mut);font-weight:500;font-size:13px}
.chip .hand{font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:5px;padding:0 3px}
.chip .rm{position:absolute;top:-9px;right:-7px;width:17px;height:17px;border-radius:50%;background:#2a2a2a;border:1px solid var(--line);color:var(--mut);font-size:10px;display:flex;align-items:center;justify-content:center;padding:0}
.chip.ghosted{opacity:.25}
.bench{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px;margin-bottom:12px}
.bwrap{display:flex;flex-wrap:wrap;gap:10px 16px;min-height:38px;align-items:center;padding-top:6px}
.bwrap .chip{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:9px 12px}
.dragghost{position:fixed;z-index:99;pointer-events:none;opacity:.95;transform:translate(-50%,-50%) scale(1.06);background:var(--panel2);border:1px solid var(--acc);border-radius:10px;padding:8px 14px;font-weight:600;white-space:nowrap;box-shadow:0 8px 24px #000c}
#tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(15,15,15,.96);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
#tabs button{flex:1;padding:14px 0;color:var(--mut);background:none;border:0;font-size:14px}
#tabs button.on{color:var(--txt);font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.card h3{margin:0 0 10px;font-size:16px}
.frow{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.inp{background:#101010;border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:10px;font-size:17px;min-width:0}
.inp:focus{outline:none;border-color:var(--acc)}
select.inp{appearance:none;-webkit-appearance:none}
.prow{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .nm2{font-weight:600}
.prow .meta{color:var(--mut);font-size:13px}
.badge{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 5px;color:var(--mut);letter-spacing:.05em;white-space:nowrap}
.prow .grow{flex:1;min-width:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#modal{position:fixed;inset:0;background:#000a;z-index:50;display:flex;align-items:flex-start;justify-content:center;padding-top:8vh}
#modal.hidden{display:none}
.mbox{width:min(92vw,420px);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;max-height:75vh;overflow:auto}
.mbox h3{margin:0 0 12px;font-size:16px}
.trow{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.trow .grow{flex:1;font-weight:600;text-align:left}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));background:#242424;border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:9px 14px;font-size:13px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.hint{color:var(--mut);font-size:13px;margin:8px 0 0}
</style>
</head>
<body>
<header id="hdr">
  <button id="teamBtn" data-act="teams">&#127952; <span id="teamName"></span> &#9662;</button>
  <button class="btn" id="shareBtn" data-act="share">Share</button>
</header>
<main id="main"></main>
<nav id="tabs">
  <button data-tab="lines" class="on">Lines</button>
  <button data-tab="units">PP / PK</button>
  <button data-tab="roster">Roster</button>
</nav>
<div id="modal" class="hidden"></div>
<div id="toast"></div>
<script>
'use strict';
var LSKEY='hockey_liney_v1';
var $=function(s){return document.querySelector(s);};
var SECS={
 f:{rows:4,cols:3,labels:['LW','C','RW'],tag:'L'},
 d:{rows:3,cols:2,labels:['LD','RD'],tag:'D'},
 g:{rows:1,cols:2,labels:['Starter','Backup'],tag:'G'},
 pp:{rows:2,cols:5,labels:['LW','C','RW','LD','RD'],tag:'PP'},
 pk:{rows:2,cols:4,labels:['F','F','D','D'],tag:'PK'}
};
var SEC_ORDER=['f','d','g','pp','pk'];

function nid(){return 'p'+Math.random().toString(36).slice(2,10)+'0';}
function newTeam(name){
 return {id:nid(),name:name,players:[],
  lines:{f:[[null,null,null],[null,null,null],[null,null,null],[null,null,null]],
         d:[[null,null],[null,null],[null,null]],
         g:[[null,null]]},
  pp:[[null,null,null,null,null],[null,null,null,null,null]],
  pk:[[null,null,null,null],[null,null,null,null]]};
}
function defaultState(){var t=newTeam('My Team');return {teams:[t],active:t.id};}
function load(){
 try{var r=localStorage.getItem(LSKEY);
  if(r){var s=JSON.parse(r);if(s&&Array.isArray(s.teams)&&s.teams.length)return s;}
 }catch(e){}
 return defaultState();
}
function save(){try{localStorage.setItem(LSKEY,JSON.stringify(S));}catch(e){toast('Storage full?');}}
var S=load();
var tab='lines', sel=null, suppressClick=false;
function T(){var t=S.teams.find(function(x){return x.id===S.active;});return t||S.teams[0];}
function slotsOf(t,sec){
 if(sec==='f'||sec==='d'||sec==='g')return t.lines[sec];
 return t[sec];
}
function playerById(t,pid){
 for(var i=0;i<t.players.length;i++)if(t.players[i].id===pid)return t.players[i];
 return null;
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function removeFromSection(t,sec,pid){
 var arr=slotsOf(t,sec);
 for(var i=0;i<arr.length;i++)for(var j=0;j<arr[i].length;j++)if(arr[i][j]===pid)arr[i][j]=null;
}
function removeAllSlots(t,pid){
 SEC_ORDER.forEach(function(sec){removeFromSection(t,sec,pid);});
}
function findSlot(t,pid){
 for(var s=0;s<SEC_ORDER.length;s++){
  var sec=SEC_ORDER[s],arr=slotsOf(t,sec);
  for(var i=0;i<arr.length;i++)for(var j=0;j<arr[i].length;j++)
   if(arr[i][j]===pid)return {sec:sec,i:i,j:j};
 }
 return null;
}
function inSection(t,sec,pid){return !!findSlotIn(t,sec,pid);}
function findSlotIn(t,sec,pid){
 var arr=slotsOf(t,sec);
 for(var i=0;i<arr.length;i++)for(var j=0;j<arr[i].length;j++)if(arr[i][j]===pid)return {sec:sec,i:i,j:j};
 return null;
}
/* place pid into target slot. src = {sec,i,j} or null (bench). Cross-section occupied -> displaced stays if src given (swap), else to bench. Same-section uniqueness enforced. */
function place(t,tgt,pid,src){
 var p=playerById(t,pid);if(!p)return;
 var arr=slotsOf(t,tgt.sec);
 if(src!==null){
  var sArr=slotsOf(t,src.sec);
  if(sArr[src.i][src.j]===pid)sArr[src.i][src.j]=null;
 }
 removeFromSection(t,tgt.sec,pid);
 var occ=arr[tgt.i][tgt.j];
 if(occ){
  if(src){removeFromSection(t,src.sec,occ);slotsOf(t,src.sec)[src.i][src.j]=occ;}
  /* src null: displaced player simply returns to bench (slot overwritten) */
 }
 arr[tgt.i][tgt.j]=pid;
 save();render();
}
function rowLabel(sec,i){return SECS[sec].tag+(i+1);}

/* ---------- rendering ---------- */
function chipHTML(t,pid,inSlot){
 var p=playerById(t,pid);if(!p)return '';
 var h=esc(p.name)+(p.nu?'':'');
 var selCls=(sel&&sel.pid===pid)?' sel':'';
 var rm=inSlot?'<button class="rm" data-act="rm" data-sec="'+inSlot.sec+'" data-i="'+inSlot.i+'" data-j="'+inSlot.j+'">&#10005;</button>':'';
 return '<div class="chip'+selCls+'" data-pid="'+pid+'">'+
  (p.nu?'<span class="num">#'+esc(p.nu)+'</span>':'')+
  '<span class="nm">'+esc(p.name)+'</span>'+
  (p.hn?'<span class="hand">'+esc(p.hn)+'</span>':'')+rm+'</div>';
}
function slotHTML(t,sec,i,j,val){
 var lab=val?'<span class="lab">'+SECS[sec].labels[j]+'</span>':'';
 var inner=val?chipHTML(t,val,{sec:sec,i:i,j:j}):'<span class="ph">add '+SECS[sec].labels[j]+'</span>';
 var full=val?' full':'';
 return '<div class="slot'+full+'" data-slot="1" data-sec="'+sec+'" data-i="'+i+'" data-j="'+j+'">'+lab+inner+'</div>';
}
function secBlock(t,sec,title,autofill){
 var arr=slotsOf(t,sec),rows='';
 for(var i=0;i<SECS[sec].rows;i++){
  var s='';
  for(var j=0;j<SECS[sec].cols;j++)s+=slotHTML(t,sec,i,j,arr[i][j]);
  rows+='<div class="slotrow">'+s+'</div>';
 }
 var af=autofill?'<button class="btn sm" data-act="af" data-sec="'+sec+'">Auto</button>':'';
 return '<div class="sec"><div class="sechd"><b>'+esc(title)+'</b><span style="display:flex;gap:6px">'+af+
  '<button class="btn sm" data-act="clear" data-sec="'+sec+'">Clear</button></span></div>'+rows+'</div>';
}
function benchChips(t){
 var assigned={};
 SEC_ORDER.forEach(function(sec){var a=slotsOf(t,sec);for(var i=0;i<a.length;i++)for(var j=0;j<a[i].length;j++)if(a[i][j])assigned[a[i][j]]=1;});
 var out='';
 for(var i=0;i<t.players.length;i++){
  var p=t.players[i];if(assigned[p.id])continue;
  out+=chipHTML(t,p.id,null);
 }
 if(!out)out='<span class="hint" style="margin:0">All players placed</span>';
 return '<div class="bench"><div class="sechd" style="margin:0"><b>Bench</b><span class="hint" style="margin:0">tap a player, then a slot</span></div><div class="bwrap" id="benchWrap">'+out+'</div></div>';
}
function renderLines(){
 var t=T();
 return benchChips(t)+secBlock(t,'f','Forwards',false)+secBlock(t,'d','Defence',false)+secBlock(t,'g','Goalies',false);
}
function renderUnits(){
 var t=T();
 return '<div class="hint" style="margin:2px 2px 10px">Same mechanics: tap a player, then a slot.</div>'+
  secBlock(t,'pp','Power play',true)+secBlock(t,'pk','Penalty kill',true);
}
function badgesOf(t,pid){
 var out=[];
 SEC_ORDER.forEach(function(sec){
  var a=slotsOf(t,sec);
  for(var i=0;i<a.length;i++)for(var j=0;j<a[i].length;j++)if(a[i][j]===pid)out.push(rowLabel(sec,i));
 });
 return out.map(function(b){return '<span class="badge">'+b+'</span>';}).join('');
}
function renderRoster(){
 var t=T();
 var h='';
 h+='<div class="card"><h3>Add player</h3>'+
  '<div class="frow"><input class="inp" id="npName" placeholder="Name" style="flex:2"><input class="inp" id="npNum" placeholder="#" style="flex:1;max-width:64px" inputmode="numeric"></div>'+
  '<div class="frow"><select class="inp" id="npPos" style="flex:1"><option value="F">Forward</option><option value="D">Defence</option><option value="G">Goalie</option></select>'+
  '<select class="inp" id="npHand" style="flex:1"><option value="L">Left</option><option value="R">Right</option></select>'+
  '<button class="btn acc" data-act="addP">Add</button></div></div>';
 h+='<div class="card"><h3>Players ('+t.players.length+')</h3>';
 if(!t.players.length)h+='<div class="hint" style="margin:0">No players yet</div>';
 for(var i=0;i<t.players.length;i++){
  var p=t.players[i];
  h+='<div class="prow"><span class="grow"><span class="nm2">'+esc(p.name)+'</span>'+
   (p.nu?'<span class="meta">#'+esc(p.nu)+'</span>':'')+
   '<span class="meta">'+esc(p.pos)+(p.hn?' · '+esc(p.hn):'')+'</span>'+badgesOf(t,p.id)+'</span>'+
   '<button class="btn sm" data-act="editP" data-pid="'+p.id+'">Edit</button></div>';
 }
 h+='</div>';
 h+='<div class="card"><h3>Copy to home-screen app / Safari</h3><div class="frow"><button class="btn acc" data-act="copyT">Copy data</button><button class="btn acc" data-act="pasteT">Paste data</button></div>'+
  '<p class="hint">iPhone keeps Safari and home-screen app data separate. To move rosters between them: in the app that HAS the data tap Copy data, open the other one, tap Paste data. Also use this to move rosters between devices (send the text via Messages/Notes).</p></div>';
 h+='<div class="card"><h3>Backup</h3><div class="frow"><button class="btn" data-act="export">Export JSON file</button><button class="btn" data-act="import">Import JSON file</button><button class="btn danger" data-act="reset">Reset app</button></div>'+
  '<p class="hint">Saves a .json to Files/iCloud before switching phones. Roster &amp; lines live on this device.</p></div>';
 return h;
}
function render(){
 save();
 $('#teamName').textContent=T().name;
 var m=$('#main');
 if(tab==='lines')m.innerHTML=renderLines();
 else if(tab==='units')m.innerHTML=renderUnits();
 else m.innerHTML=renderRoster();
}
function setTab(name){
 tab=name;sel=null;
 var bs=document.querySelectorAll('#tabs button');
 for(var i=0;i<bs.length;i++)bs[i].classList.toggle('on',bs[i].dataset.tab===name);
 render();
 window.scrollTo(0,0);
}

/* ---------- actions ---------- */
function toast(msg){
 var el=$('#toast');el.textContent=msg;el.classList.add('show');
 clearTimeout(toast._t);toast._t=setTimeout(function(){el.classList.remove('show');},1700);
}
function doClear(sec){var t=T();var a=slotsOf(t,sec);for(var i=0;i<a.length;i++)for(var j=0;j<a[i].length;j++)a[i][j]=null;save();render();}
function doAuto(sec){
 var t=T();
 if(sec==='f'||sec==='d'||sec==='g'){
  var pos=(sec==='f')?'F':(sec==='d')?'D':'G';
  var pool=t.players.filter(function(p){return p.pos===pos&&!inSection(t,sec,p.id);});
  var a=slotsOf(t,sec),k=0;
  for(var i=0;i<a.length;i++)for(var j=0;j<a[i].length;j++){
   if(!a[i][j]&&k<pool.length){a[i][j]=pool[k].id;k++;}
  }
  save();render();return;
 }
 if(sec==='pp'||sec==='pk'){
  var inPP={},pool2=[],order=sec==='pp'?['F','D']:['D','F'];
  var a2=slotsOf(t,sec);
  for(var i2=0;i2<a2.length;i2++)for(var j2=0;j2<a2[i2].length;j2++)if(a2[i2][j2])inPP[a2[i2][j2]]=1;
  order.forEach(function(ppos){t.players.forEach(function(p){if(p.pos===ppos&&!inPP[p.id])pool2.push(p);});});
  var k2=0;
  for(var i3=0;i3<a2.length;i3++)for(var j3=0;j3<a2[i3].length;j3++){
   if(!a2[i3][j3]&&k2<pool2.length){a2[i3][j3]=pool2[k2].id;k2++;}
  }
  save();render();
 }
}
function buildShareText(){
 var t=T(),out=t.name+' — lineup\n';
 SEC_ORDER.forEach(function(sec){
  var a=slotsOf(t,sec);
  for(var i=0;i<a.length;i++){
   var parts=[],any=false;
   for(var j=0;j<a[i].length;j++){
    var pid=a[i][j];
    if(!pid){parts.push('—');continue;}
    any=true;
    var p=playerById(t,pid);
    parts.push((p.nu?p.nu+' ':'')+p.name+' ('+SECS[sec].labels[j]+')');
   }
   if(any||sec==='f'||sec==='d'||sec==='g')out+=rowLabel(sec,i)+': '+parts.join(' · ')+'\n';
  }
  out+='\n';
 });
 var bench='',asn={};
 SEC_ORDER.forEach(function(sec){var a=slotsOf(t,sec);for(var i=0;i<a.length;i++)for(var j=0;j<a[i].length;j++)if(a[i][j])asn[a[i][j]]=1;});
 t.players.forEach(function(p){if(!asn[p.id])bench+=(bench?', ':'')+p.name;});
 if(bench)out+='Bench: '+bench+'\n';
 return out.trim();
}
function doShare(){
 var txt=buildShareText();
 if(navigator.share){navigator.share({text:txt}).catch(function(){});}
 else if(navigator.clipboard){navigator.clipboard.writeText(txt).then(function(){toast('Copied');});}
 else toast(txt);
}
function doExport(){
 var blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
 var a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download='lineup-backup-'+new Date().toISOString().slice(0,10)+'.json';
 document.body.appendChild(a);a.click();a.remove();
 toast('Exported');
}
function doImport(){
 var inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
 inp.onchange=function(){
  var f=inp.files&&inp.files[0];if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
   try{
    var d=JSON.parse(rd.result);
    applyImport(d,'Imported');
   }catch(e){toast('Not a valid backup file');}
  };
  rd.readAsText(f);
 };
 inp.click();
}
function stateText(){return 'LINEY1:'+JSON.stringify(S);}
function applyStateText(txt){
 try{
  txt=txt.trim();
  if(txt.indexOf('LINEY1:')!==0)throw new Error('fmt');
  var d=JSON.parse(txt.slice(7));
  applyImport(d,'Data pasted');
 }catch(e){
  try{
   var d2=JSON.parse(txt);
   applyImport(d2,'Data pasted');
  }catch(e2){toast('Could not read that data');}
 }
}
function doCopyState(){
 var txt=stateText(),done=function(){toast('Data copied');};
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,function(){fallbackCopy(txt);});}
 else fallbackCopy(txt);
}
function fallbackCopy(txt){
 var ta=document.createElement('textarea');ta.value=txt;
 ta.style.cssText='position:fixed;left:0;top:0;width:1px;height:1px;opacity:0';
 document.body.appendChild(ta);ta.focus();ta.select();
 var ok=document.execCommand('copy');ta.remove();
 toast(ok?'Data copied':'Copy failed — hold Paste to see raw text');
 if(ok)return;
 window.__lineyRaw=txt;
}
function doPasteState(){
 if(navigator.clipboard&&navigator.clipboard.readText){
  navigator.clipboard.readText().then(function(t){applyStateText(t);},function(){promptPaste();});
 } else promptPaste();
}
function promptPaste(){
 var raw=prompt('Paste the copied data here (long-press → Paste):');
 if(raw)applyStateText(raw);
}
function applyImport(d,msg){
 if(!d||!Array.isArray(d.teams)||!d.teams.length)throw new Error('bad');
 S=d;
 S.active=S.teams.find(function(x){return x.id===d.active;})?d.active:S.teams[0].id;
 save();render();closeModal();
 toast(msg);
}
function doReset(){
 if(!confirm('Reset app? All teams, players and lines will be deleted (export a backup first).'))return;
 localStorage.removeItem(LSKEY);S=defaultState();closeModal();render();toast('Reset done');
}

/* ---------- modals ---------- */
function openModal(html){$('#modal').innerHTML='<div class="mbox">'+html+'</div>';$('#modal').classList.remove('hidden');}
function closeModal(){$('#modal').classList.add('hidden');$('#modal').innerHTML='';}
function teamsModal(){
 var h='<h3>Teams</h3>';
 S.teams.forEach(function(t){
  h+='<div class="trow"><button class="grow" data-act="pickTeam" data-tid="'+t.id+'">'+esc(t.name)+(t.id===S.active?' &nbsp;<span class="badge">active</span>':'')+'</button>'+
   '<button class="btn sm" data-act="renameTeam" data-tid="'+t.id+'">Rename</button>'+
   (S.teams.length>1?'<button class="btn sm danger" data-act="delTeam" data-tid="'+t.id+'">&#10005;</button>':'')+'</div>';
 });
 h+='<h3 style="margin:14px 0 8px">New team</h3><div class="frow"><input class="inp" id="ntName" placeholder="Team name" style="flex:1"><button class="btn acc" data-act="addTeam">Create</button></div>'+
  '<div class="frow"><select class="inp" id="copyFrom" style="flex:1"><option value="">Start with empty roster</option>'+
  S.teams.map(function(x){return '<option value="'+x.id+'">Copy roster from: '+esc(x.name)+'</option>';}).join('')+'</select></div>';
 h+='<div class="frow" style="margin-top:14px"><button class="btn" data-act="closeModal">Close</button></div>';
 openModal(h);
}
function editModal(pid){
 var t=T(),p=playerById(t,pid);if(!p)return;
 openModal('<h3>Edit player</h3>'+
  '<div class="frow"><input class="inp" id="epName" value="'+esc(p.name)+'" placeholder="Name" style="flex:2">'+
  '<input class="inp" id="epNum" value="'+esc(p.nu||'')+'" placeholder="#" style="flex:1;max-width:70px" inputmode="numeric"></div>'+
  '<div class="frow"><select class="inp" id="epPos" style="flex:1">'+
  ['F','D','G'].map(function(v){return '<option value="'+v+'"'+(p.pos===v?' selected':'')+'>'+({F:'Forward',D:'Defence',G:'Goalie'})[v]+'</option>';}).join('')+'</select>'+
  '<select class="inp" id="epHand" style="flex:1"><option value="L"'+(p.hn==='L'?' selected':'')+'>Left</option><option value="R"'+(p.hn==='R'?' selected':'')+'>Right</option></select></div>'+
  '<div class="frow" style="margin-top:14px"><button class="btn acc" data-act="saveP" data-pid="'+p.id+'">Save</button>'+
  '<button class="btn danger" data-act="delP" data-pid="'+p.id+'">Delete player</button>'+
  '<button class="btn" data-act="closeModal">Cancel</button></div>');
}

/* ---------- global click handling ---------- */
document.addEventListener('click',function(e){
 var actEl=e.target.closest('[data-act]');
 if(actEl){
  var act=actEl.dataset.act,t=T();
  if(act==='share')doShare();
  else if(act==='teams')teamsModal();
  else if(act==='closeModal')closeModal();
  else if(act==='rm'){e.stopPropagation();var a=slotsOf(t,actEl.dataset.sec);a[+actEl.dataset.i][+actEl.dataset.j]=null;sel=null;save();render();return;}
  else if(act==='clear')doClear(actEl.dataset.sec);
  else if(act==='af')doAuto(actEl.dataset.sec);
  else if(act==='addP'){
   var nm=$('#npName').value.trim();
   if(!nm){toast('Name required');return;}
   t.players.push({id:nid(),name:nm,nu:$('#npNum').value.trim(),pos:$('#npPos').value,hn:$('#npHand').value});
   $('#npName').value='';$('#npNum').value='';save();render();toast('Added');
  }
  else if(act==='editP')editModal(actEl.dataset.pid);
  else if(act==='saveP'){
   var p=playerById(t,actEl.dataset.pid);
   if(p){p.name=$('#epName').value.trim()||p.name;p.nu=$('#epNum').value.trim();p.pos=$('#epPos').value;p.hn=$('#epHand').value;save();closeModal();render();}
  }
  else if(act==='delP'){
   if(confirm('Delete this player?')){removeAllSlots(t,actEl.dataset.pid);t.players=t.players.filter(function(x){return x.id!==actEl.dataset.pid;});save();closeModal();render();}
  }
  else if(act==='pickTeam'){S.active=actEl.dataset.tid;save();closeModal();render();}
  else if(act==='renameTeam'){
   var tt=S.teams.find(function(x){return x.id===actEl.dataset.tid;});
   if(!tt)return;
   var nn=prompt('Team name',tt.name);
   if(nn&&nn.trim()){tt.name=nn.trim();save();render();closeModal();}
  }
  else if(act==='delTeam'){
   if(S.teams.length<2){toast('Keep at least one team');return;}
   if(confirm('Delete this team?')){S.teams=S.teams.filter(function(x){return x.id!==actEl.dataset.tid;});if(!S.teams.find(function(x){return x.id===S.active;})){S.active=S.teams[0].id;}save();closeModal();render();}
  }
  else if(act==='addTeam'){
   var n=$('#ntName').value.trim();
   if(!n){toast('Name required');return;}
   var nt=newTeam(n);
   var cf=$('#copyFrom')?$('#copyFrom').value:'';
   var srcT=cf?S.teams.find(function(x){return x.id===cf;}):null;
   if(srcT){
     nt.players=srcT.players.map(function(p){return {id:nid(),name:p.name,nu:p.nu,pos:p.pos,hn:p.hn};});
   }
   S.teams.push(nt);S.active=nt.id;save();closeModal();render();
   toast(srcT?('Created with '+nt.players.length+' copied players'):'Created');
  }
  else if(act==='export')doExport();
  else if(act==='import')doImport();
  else if(act==='copyT')doCopyState();
  else if(act==='pasteT')doPasteState();
  else if(act==='reset')doReset();
  return;
 }
 var chipEl=e.target.closest('.chip');
 if(chipEl&&chipEl.closest('.slot')&&!sel&&!suppressClick){
  sel={pid:chipEl.dataset.pid,src:findSlot(T(),chipEl.dataset.pid)};
  render();
  return;
 }
 var slotEl=e.target.closest('.slot');
 if(slotEl&&!suppressClick){
  if(sel&&chipEl&&sel.pid===chipEl.dataset.pid){sel=null;render();return;}
  if(sel){
   place(T(),{sec:slotEl.dataset.sec,i:+slotEl.dataset.i,j:+slotEl.dataset.j},sel.pid,sel.src);
   sel=null;
  }
  return;
 }
 if(chipEl&&!suppressClick){
  var pid=chipEl.dataset.pid;
  if(sel&&sel.pid===pid){sel=null;}
  else{sel={pid:pid,src:findSlot(T(),pid)};}
  render();
  return;
 }
 if(!e.target.closest('.bench')){if(sel){sel=null;render();}}
},false);
document.addEventListener('click',function(){suppressClick=false;},true);

/* ---------- drag (pointer-based, works on iOS touch) ---------- */
var drag=null;
document.addEventListener('pointerdown',function(e){
 if(e.button&&e.button!==0)return;
 var chip=e.target.closest('.chip');
 if(!chip||e.target.closest('.rm'))return;
 drag={pid:chip.dataset.pid,chip:chip,x0:e.clientX,y0:e.clientY,started:false,ghost:null,w:0,h:0};
},true);
window.addEventListener('pointermove',function(e){
 if(!drag)return;
 var dx=e.clientX-drag.x0,dy=e.clientY-drag.y0;
 if(!drag.started){
  if(Math.abs(dx)<8&&Math.abs(dy)<8)return;
  drag.started=true;suppressClick=true;
  var r=drag.chip.getBoundingClientRect();
  drag.w=r.width;drag.h=r.height;
  drag.chip.classList.add('ghosted');
  var p=playerById(T(),drag.pid);
  var g=document.createElement('div');
  g.className='dragghost';
  g.textContent=(p&&p.nu?'#'+p.nu+' ':'')+(p?p.name:'');
  document.body.appendChild(g);drag.ghost=g;
 }
 drag.ghost.style.left=e.clientX+'px';
 drag.ghost.style.top=e.clientY+'px';
 var el=document.elementFromPoint(e.clientX,e.clientY);
 var sl=el&&el.closest('.slot');
 document.querySelectorAll('.slot.hover').forEach(function(x){x.classList.remove('hover');});
 if(sl)sl.classList.add('hover');
},true);
window.addEventListener('pointerup',function(e){
 if(!drag)return;
 var d=drag;drag=null;
 if(d.ghost)d.ghost.remove();
 d.chip.classList.remove('ghosted');
 document.querySelectorAll('.slot.hover').forEach(function(x){x.classList.remove('hover');});
 if(!d.started){return;} /* plain tap -> click handler does selection */
 if(suppressClick)setTimeout(function(){suppressClick=false;},0);
 var el=document.elementFromPoint(e.clientX,e.clientY);
 var sl=el&&el.closest('.slot');
 var t=T();
 if(sl){
  place(t,{sec:sl.dataset.sec,i:+sl.dataset.i,j:+sl.dataset.j},d.pid,findSlot(t,d.pid));
  sel=null;return;
 }
 if(el&&el.closest('#benchWrap')){
  var src=findSlot(t,d.pid);
  if(src){removeFromSection(t,src.sec,d.pid);save();render();}
  return;
 }
});
window.addEventListener('pointercancel',function(e){
 if(!drag)return;
 if(drag.ghost)drag.ghost.remove();
 drag.chip.classList.remove('ghosted');
 drag=null;suppressClick=true;setTimeout(function(){suppressClick=false;},0);
},true);

/* ---------- boot ---------- */
document.querySelectorAll('#tabs button').forEach(function(b){
 b.addEventListener('click',function(){setTab(b.dataset.tab);});
});
$('#shareBtn').addEventListener('click',function(e){e.stopPropagation();doShare();});
if('serviceWorker' in navigator&&location.protocol==='https:'){
 navigator.serviceWorker.register('./sw.js').catch(function(){});
}
render();
</script>
</body>
</html>
